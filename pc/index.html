<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prox</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-app-region: drag;
    overflow: hidden;
  }

  /* ── Title bar ── */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 4px;
    flex-shrink: 0;
  }
  .titlebar-title {
    font-size: 13px;
    font-weight: 600;
    color: #636366;
    letter-spacing: 0.5px;
  }
  .titlebar-btns {
    display: flex;
    gap: 8px;
    -webkit-app-region: no-drag;
  }
  .tbtn {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: filter .15s;
  }
  .tbtn:hover { filter: brightness(1.3); }
  .tbtn.minimize { background: #ffbd2e; }
  .tbtn.close    { background: #ff5f57; }

  /* ── Main content ── */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 24px 28px;
  }

  /* ── Logo ── */
  .logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo {
    width: 88px; height: 88px;
    border-radius: 26px;
    background: linear-gradient(145deg, #0a84ff 0%, #5e5ce6 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 800; color: #fff;
    box-shadow: 0 8px 30px rgba(10,132,255,.4);
  }
  .logo-name { font-size: 20px; font-weight: 700; letter-spacing: 1px; }

  /* ── Server card ── */
  .card {
    width: 100%;
    background: #1c1c1e;
    border-radius: 16px;
    padding: 14px 18px;
  }
  .card-head {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: .8px; color: #636366; margin-bottom: 10px;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #2c2c2e;
  }
  .row:last-child { border-bottom: none; }
  .lbl { font-size: 14px; color: #8e8e93; }
  .val { font-size: 14px; font-weight: 500; }

  /* ── Status ── */
  .status-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #3a3a3c;
    transition: background .4s, box-shadow .4s;
  }
  .dot.on {
    background: #30d158;
    box-shadow: 0 0 0 4px rgba(48,209,88,.18), 0 0 12px rgba(48,209,88,.35);
  }
  .dot.busy { background: #ffd60a; box-shadow: 0 0 8px rgba(255,214,10,.4); }
  .status-lbl {
    font-size: 14px; color: #636366; transition: color .3s;
  }
  .status-lbl.on { color: #30d158; }
  .status-lbl.busy { color: #ffd60a; }

  /* ── Button ── */
  .btn {
    width: 100%; padding: 15px;
    border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; color: #fff;
    background: #0a84ff;
    cursor: pointer;
    transition: background .25s, transform .1s, filter .15s;
    -webkit-app-region: no-drag;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(.97); }
  .btn.on { background: #ff453a; }
  .btn:disabled { opacity: .4; cursor: default; transform: none; filter: none; }
</style>
</head>
<body>

<div class="titlebar">
  <span class="titlebar-title">prox</span>
  <div class="titlebar-btns">
    <button class="tbtn minimize" onclick="window.api.hide()"></button>
    <button class="tbtn close"    onclick="window.api.quit()"></button>
  </div>
</div>

<div class="content">

  <div class="logo-wrap">
    <div class="logo">P</div>
    <div class="logo-name">prox</div>
  </div>

  <div class="card">
    <div class="card-head">Сервер</div>
    <div class="row"><span class="lbl">Провайдер</span><span class="val">Cloudflare</span></div>
    <div class="row"><span class="lbl">Протокол</span><span class="val">WS + TLS</span></div>
    <div class="row"><span class="lbl">Порт</span><span class="val">443</span></div>
  </div>

  <div class="status-wrap">
    <div class="dot" id="dot"></div>
    <div class="status-lbl" id="slbl">Отключено</div>
  </div>

  <button class="btn" id="btn" onclick="toggle()">Подключиться</button>

</div>

<script>
  let busy = false;
  let on = false;

  function ui(state) {
    on = state === 'on';
    const dot  = document.getElementById('dot');
    const slbl = document.getElementById('slbl');
    const btn  = document.getElementById('btn');

    dot.className  = 'dot'        + (state !== 'off' ? ' ' + state : '');
    slbl.className = 'status-lbl' + (state !== 'off' ? ' ' + state : '');
    slbl.textContent = state === 'on' ? 'Подключено' : state === 'busy' ? 'Подождите...' : 'Отключено';
    btn.className  = 'btn' + (on ? ' on' : '');
    btn.textContent = on ? 'Отключиться' : 'Подключиться';
    btn.disabled = state === 'busy';
  }

  async function toggle() {
    if (busy) return;
    busy = true;
    ui('busy');
    try {
      if (on) {
        await window.api.disconnect();
        ui('off');
      } else {
        const r = await window.api.connect();
        ui(r.ok ? 'on' : 'off');
        if (!r.ok) document.getElementById('slbl').textContent = 'Ошибка';
      }
    } catch (_) { ui('off'); }
    busy = false;
  }

  (async () => {
    const { connected } = await window.api.status();
    ui(connected ? 'on' : 'off');
  })();
</script>
</body>
</html>
