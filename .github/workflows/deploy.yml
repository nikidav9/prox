name: Deploy to Railway

on:
  push:
    branches: ["claude/inspiring-clarke-VpxZc", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: f77cfa91-7494-4cb7-af9c-960ebf4d263c
        run: railway up --detach --service 783e8319-c595-46ca-8190-e93fa19a11be
