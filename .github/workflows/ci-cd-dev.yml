name: CI/CD Dev

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 123456789012.dkr.ecr.eu-central-1.amazonaws.com
  IMAGE_NAME: prox
  ENV: dev

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-push:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENV }}
      - run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENV }}

  deploy-dev:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nikidav9/infra-manifests
          token: ${{ secrets.GH_INFRA_TOKEN }}
          path: manifests
      - uses: aws-actions/eks-kubectl@v2
        with:
          cluster-name: dev-eks-cluster
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-eks-deploy
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          yq e -i '.image.tag = "${{ github.sha }}"' manifests/helm/prox/values-dev.yaml
      - run: |
          helm upgrade prox-dev ./manifests/helm/prox \
            --install \
            --namespace dev \
            -f manifests/helm/prox/values-dev.yaml
      - run: kubectl -n dev rollout status deployment/prox-dev